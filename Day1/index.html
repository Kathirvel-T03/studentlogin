<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="registration-container">
        <header class="form-header">
            <h1>Course Enrollment Form</h1>
            <p>Secure your spot by filling out the details below. All fields marked with * are mandatory.</p>
        </header>

        <form class="registration-form" action="#" method="POST" autocomplete="on">
            <fieldset class="form-section">
                <legend>Personal Details</legend>

                <div class="form-group grid-2">
                    <label for="full_name">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Kathir" required>
                </div>

                <div class="form-group grid-2">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="kathirtki@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="e.g., +1 987-654-3210" required >
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group form-group-radio">
                    <label>Gender *</label>
                    <div class="radio-options">
                        <input type="radio" id="gender_male" name="gender" value="male" required>
                        <label for="gender_male">Male</label>

                        <input type="radio" id="gender_female" name="gender" value="female">
                        <label for="gender_female">Female</label>

                        <input type="radio" id="gender_other" name="gender" value="other">
                        <label for="gender_other">Other</label>
                    </div>
                </div>

                <div class="form-group form-group-full">
                    <label for="address">Full Address *</label>
                    <textarea id="address" name="address" rows="3" placeholder="Street Address, City, State/Province, Zip Code" required></textarea>
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Course Selection</legend>

                <div class="form-group">
                    <label for="course">Select Course *</label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>-- Choose a Course --</option>
                        <option value="web_dev">Web Development</option>
                        <option value="data_science">Data Science</option>
                        <option value="ui_ux">UI/UX Design</option>
                        <option value="cyber_sec">Cyber Security</option>
                    </select>
                </div>

                <div class="form-group form-group-radio">
                    <label>Preferred Batch Timing *</label>
                    <div class="radio-options">
                        <input type="radio" id="time_morning" name="batch_timing" value="morning" required>
                        <label for="time_morning">Morning (9:00 AM)</label>

                        <input type="radio" id="time_afternoon" name="batch_timing" value="afternoon">
                        <label for="time_afternoon">Afternoon (2:00 PM)</label>

                        <input type="radio" id="time_evening" name="batch_timing" value="evening">
                        <label for="time_evening">Evening (7:00 PM)</label>
                    </div>
                </div>

                <div class="form-group form-group-full">
                    <label for="id_proof">Upload ID Proof (Passport/Aadhaar/Driving License) *</label>
                    <input type="file" id="id_proof" name="id_proof" accept=".pdf,.jpg,.jpeg,.png" required>
                    <small class="file-note">Max file size: 5MB. Accepted formats: PDF, JPG, PNG.</small>
                </div>

            </fieldset>

            <fieldset class="form-section">
                <legend>Additional Information</legend>

                <div class="form-group form-group-full">
                    <label for="notes">Additional Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Any specific requirements or questions you have..."></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="btn btn-warning">Enroll Now</button>
                <button type="reset" class="btn btn-reset">Reset Form</button>
            </div>
        </form>
    </div>
</body>
</html>
